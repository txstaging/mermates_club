# Cache policy per file type (HTML always revalidates, assets cached a week)
map $uri $cache_control {
    default                                             "no-cache";
    ~*\.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$      "public, max-age=604800";
    ~*\.(mp4|webm)$                                     "public, max-age=604800";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Compress text assets (videos/images are already compressed)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Headers set once here; no location below uses add_header, so all inherit them
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets: don't fill the access log
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?|mp4|webm)$ {
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
